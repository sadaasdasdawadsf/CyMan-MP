name: Build Server (Linux, Debian 12)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_FORCE_SYSTEM_BINARIES: 1
  CMAKE_BUILD_TYPE: "Release"
  DEBIAN_FRONTEND: "noninteractive"

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: debian:12
    steps:
      - name: get-cmake
        uses: lukka/get-cmake@v3.28.1

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install git
        run: |
          apt-get update -y
          apt-get install -y git

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Git config safe directory
        run: bash ./scripts/debian-12/1.5-git-safe.sh

      - name: Install Dependencies
        run: bash ./scripts/debian-12/1-install-deps.sh

      - name: Create Build Environment
        run: bash ./scripts/debian-12/2-configure.sh '-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: Build Server
        run: bash ./scripts/debian-12/3-build.sh

      - name: Name the asset the way the egg expects
        run: cp ./bin/BeamMP-Server ./BeamMP-Server.debian.12.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Server
          path: ./BeamMP-Server.debian.12.x86_64

      - name: Publish release (what the egg downloads)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: ./BeamMP-Server.debian.12.x86_64